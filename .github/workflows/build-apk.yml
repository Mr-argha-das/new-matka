name: Build Android APK

on:
  # Manual trigger from GitHub -> Actions tab -> "Build Android APK" -> Run workflow
  workflow_dispatch:

  # Auto-trigger when app code changes
  push:
    paths:
      - "sridevimatka_app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: sridevimatka_app
        run: flutter pub get

      - name: Build release APK
        working-directory: sridevimatka_app
        run: flutter build apk --release

      - name: Copy APK to landing page download path
        run: |
          mkdir -p sridevimatka_landing/app
          cp sridevimatka_app/build/app/outputs/flutter-apk/app-release.apk sridevimatka_landing/app/sridevimatka.apk
          ls -la sridevimatka_landing/app/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sridevimatka-apk
          path: sridevimatka_landing/app/sridevimatka.apk

      - name: Commit updated APK back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sridevimatka_landing/app/sridevimatka.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "ci: update sridevimatka.apk (auto-build) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
